<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBuddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="ChatBuddy home">
          <span class="brand-mark">✦</span>
          <span>ChatBuddy</span>
        </a>
        <span class="status"><span class="status-dot"></span> Gemini online</span>
      </header>

      <section class="chat-panel" aria-label="Chat with ChatBuddy">
        <div class="intro" id="intro">
          <p class="eyebrow">YOUR POCKET THINKING PARTNER</p>
          <h1>What are we<br /><em>figuring out?</em></h1>
          <p class="intro-copy">Ask a question, untangle an idea, or start somewhere rough. We can shape it together.</p>
          <div class="suggestions">
            <button type="button" data-prompt="Explain a complex idea in simple terms">Explain something</button>
            <button type="button" data-prompt="Help me brainstorm three creative ideas for a project">Brainstorm ideas</button>
            <button type="button" data-prompt="Help me make a practical plan for my week">Make a plan</button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>

        <form class="composer" id="chat-form">
          <label class="sr-only" for="prompt">Your message</label>
          <textarea id="prompt" name="prompt" rows="1" placeholder="Ask ChatBuddy anything..." required></textarea>
          <button class="send-button" type="submit" aria-label="Send message" title="Send message">↑</button>
        </form>
        <p class="disclaimer">ChatBuddy can make mistakes. Check important information.</p>
      </section>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
